name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.2.0'
        required: true

permissions:
  contents: write

jobs:
  dmg:
    name: Build and publish the disk image
    runs-on: macos-15
    timeout-minutes: 40

    # A step-level `if:` cannot read the secrets context, so the two questions
    # the job needs to ask are answered once here. Only the answers are exported,
    # never the secrets themselves, so no later step can read a certificate it
    # has no business touching.
    env:
      HAS_SIGNING_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE != '' }}
      HAS_NOTARY_CREDENTIALS: ${{ secrets.NOTARY_PASSWORD != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Snaplet $VERSION"

      # The tag is the source of truth, so the download, the About pane and the
      # release can never disagree about which version this is.
      - name: Stamp the version
        run: ./scripts/set-version.sh "${{ steps.version.outputs.version }}" "${{ github.run_number }}"

      - name: Run tests
        run: ./scripts/run-tests.sh

      # Signing and notarisation are optional. Without the secrets the job still
      # produces a working disk image — it just needs the right-click Open step
      # on other Macs, which the release notes explain.
      - name: Import Developer ID certificate
        id: signing
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          PASSWORD=$(uuidgen)
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build the disk image
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity || '-' }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: ./scripts/build-dmg.sh

      - name: Notarise and staple
        id: notarise
        if: steps.signing.outputs.identity != '' && env.HAS_NOTARY_CREDENTIALS == 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "notarised=yes" >> "$GITHUB_OUTPUT"

      - name: Write the install notes
        id: notes
        run: |
          # `ls | head` hides its own failure behind head's exit status, so an
          # absent disk image once produced release notes for a file called "".
          DMG=$(ls -1 dist/*.dmg | head -1)
          if [ ! -f "$DMG" ]; then
            echo "The disk image step produced no .dmg in dist/." >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          {
            echo "## Install"
            echo
            echo "Download \`$(basename "$DMG")\`, open it and drag Snaplet to Applications."
            echo
            if [ "${{ steps.notarise.outputs.notarised }}" = "yes" ]; then
              echo "This build is signed with a Developer ID and notarised by Apple, so it opens normally."
            else
              echo "> [!IMPORTANT]"
              echo "> **Do not double-click Snaplet the first time.** This build is not notarised by"
              echo "> Apple, and a plain first launch does not merely warn you: on macOS 26 the system"
              echo "> moves the app straight to the Trash. Control-click Snaplet in Applications, choose"
              echo "> **Open**, then confirm. That is Apple's own per-app override — you do not need to"
              echo "> turn Gatekeeper off, and you should not."
              echo
              echo "macOS may still run an unnotarised app from a temporary read-only copy whose path"
              echo "changes on every launch, so the Screen & System Audio Recording grant will not"
              echo "survive a relaunch. Until this is notarised, building from source is the path that"
              echo "behaves normally. The README has the four commands."
            fi
            echo
            echo "Snaplet needs macOS 15 or later. On first capture it asks for Screen & System Audio"
            echo "Recording permission; the microphone and camera are only requested if you turn those on."
            echo
            echo "## Kurulum"
            echo
            echo "\`$(basename "$DMG")\` dosyasını indirin, açın ve Snaplet'i Uygulamalar'a sürükleyin."
            echo
            if [ "${{ steps.notarise.outputs.notarised }}" = "yes" ]; then
              echo "Bu sürüm Developer ID ile imzalı ve Apple tarafından noter onaylı, normal şekilde açılır."
            else
              echo "> [!IMPORTANT]"
              echo "> **İlk açılışta Snaplet'e çift tıklamayın.** Bu yapı Apple tarafından notarize"
              echo "> edilmiyor ve düz bir ilk açılış sizi yalnızca uyarmıyor: macOS 26'da sistem"
              echo "> uygulamayı doğrudan Çöp Sepeti'ne taşıyor. Uygulamalar klasöründe Snaplet'e"
              echo "> Control tuşuyla tıklayıp **Aç** deyin ve onaylayın. Bu, Apple'ın kendi uygulama"
              echo "> bazlı istisnası — Gatekeeper'ı kapatmanız gerekmez, kapatmayın da."
              echo
              echo "macOS bundan sonra da uygulamayı her açılışta yolu değişen geçici bir salt okunur"
              echo "kopyadan çalıştırabiliyor; bu yüzden Ekran ve Sistem Sesi Kaydı izni bir sonraki"
              echo "açılışa kalmıyor. Notarize edilene kadar normal davranan yol kaynaktan derlemek."
              echo "Gereken dört komut README'de."
            fi
            echo
            echo "Snaplet macOS 15 veya sonrasını ister. İlk çekimde Ekran ve Sistem Sesi Kaydı izni"
            echo "sorar; mikrofon ve kamera yalnızca siz açarsanız istenir."
            echo
            echo "\`\`\`"
            echo "sha256  $(shasum -a 256 "$DMG" | cut -d' ' -f1)"
            echo "\`\`\`"
          } > release-notes.md
          cat release-notes.md

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: Snaplet-${{ steps.version.outputs.version }}-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish the release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body_path: release-notes.md
          generate_release_notes: true
